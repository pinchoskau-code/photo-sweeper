<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120c14">
<title>Swipely</title>
<style>
/* Swipely — warm, playful, card-stack energy. The photo is still the screen; chrome glows coral. */
@font-face{font-family:"Rubik";src:local("Rubik")}
:root{
  --bg:#120c14; --bg2:#1d1322; --surface:#241a2b; --fg:#fff6f2; --muted:#b9a3b5;
  --coral:#ff5f6d; --peach:#ffc371; --keep:#3ddc97; --trash:#ff4d6d; --line:#3a2c43; --accent:var(--coral);
  --grad:linear-gradient(135deg,#ff5f6d 0%,#ffc371 100%);
  --font:"Rubik","Varela Round","Heebo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% -10%,#3a1f3d 0%,var(--bg) 60%);color:var(--fg);font-family:var(--font);overflow:hidden;position:relative}
button{font-family:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;font-size:1rem;color:var(--fg);-webkit-tap-highlight-color:transparent;transition:transform .12s}
button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid var(--peach);outline-offset:3px}
button:disabled{opacity:.4}

/* ---- home ---- */
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:calc(var(--sat) + 24px) max(20px,env(safe-area-inset-right,0px)) calc(var(--sab) + 24px) max(20px,env(safe-area-inset-left,0px))}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px}
.logo .mark{width:92px;height:92px;position:relative;margin-bottom:6px}
.logo .mark i{position:absolute;inset:0;border-radius:22px;background:var(--grad);box-shadow:0 14px 40px rgba(255,95,109,.45)}
.logo .mark i:nth-child(1){transform:rotate(-14deg) translate(-10px,2px);opacity:.45}
.logo .mark i:nth-child(2){transform:rotate(8deg) translate(8px,0);opacity:.7}
.logo .mark i:nth-child(3){transform:none;display:grid;place-items:center;font-size:2.4rem;color:#fff}
.logo h1{font-size:2.3rem;font-weight:900;margin:0;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .tag{color:var(--muted);font-size:.95rem;margin:0}
.panel p{max-width:30ch;color:var(--muted);margin:0;line-height:1.6;font-size:.95rem}
.pick{background:var(--grad);color:#fff;padding:16px 36px;font-size:1.1rem;box-shadow:0 10px 30px rgba(255,95,109,.4)}
.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);padding:11px 18px;font-size:.92rem}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row .danger{background:var(--trash);color:#fff}
.panel .sub{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:10px 16px;min-width:96px}
.chip b{display:block;font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted);font-size:.72rem}
.stat{font-size:2.4rem;font-weight:900;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:.8rem;color:var(--muted);font-weight:500}

/* ---- stage ---- */
.stage{position:absolute;inset:0}
.top{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(var(--sat) + 10px) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;background:linear-gradient(rgba(10,5,12,.7),rgba(10,5,12,0))}
.top>*{pointer-events:auto}
.count{font-variant-numeric:tabular-nums;font-size:.85rem;color:#fff;background:rgba(0,0,0,.4);padding:5px 11px;border-radius:999px;backdrop-filter:blur(6px)}
select{font:inherit;font-size:.85rem;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 11px;max-width:46vw;backdrop-filter:blur(6px)}
.bar{position:absolute;top:var(--sat);left:0;right:0;height:4px;background:rgba(255,255,255,.14);z-index:6}
.bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .25s}

.card{position:absolute;inset:0;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;overflow:hidden}
.card img.full{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.card.anim{transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s}
.card.under{transform:scale(.94) translateY(12px);opacity:.55;filter:brightness(.7)}
.card.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:scale(.94) translateY(12px);opacity:.55}to{transform:none;opacity:1}}
.meta{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 122px);text-align:center;font-size:.75rem;color:rgba(255,255,255,.8);text-shadow:0 1px 3px rgba(0,0,0,.9);padding:0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;pointer-events:none}
.stamp{position:absolute;top:calc(var(--sat) + 64px);padding:8px 18px;border:4px solid;border-radius:12px;font-weight:900;font-size:1.6rem;opacity:0;pointer-events:none;background:rgba(0,0,0,.45);z-index:3;letter-spacing:.02em}
.stamp.keep{right:22px;color:var(--keep);border-color:var(--keep);transform:rotate(12deg)}
.stamp.trash{left:22px;color:var(--trash);border-color:var(--trash);transform:rotate(-12deg)}

/* series card */
.card.series{display:flex;flex-direction:column;background:var(--bg2)}
.series .head{padding:calc(var(--sat) + 52px) 16px 8px;font-size:.9rem;color:var(--fg)}
.series .head b{display:block;font-size:1.15rem;font-weight:900}
.series .head span{color:var(--muted);font-size:.8rem}
.series .grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 6px calc(var(--sab) + 130px)}
.series .grid div{position:relative;aspect-ratio:1;overflow:hidden;border-radius:14px;background:#1a1220;touch-action:pan-y}
.series .grid img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.series .grid .chk{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.4);display:grid;place-items:center;font-size:.95rem;color:#fff;font-weight:900}
.series .grid div.on{outline:3px solid var(--keep);outline-offset:-3px}
.series .grid div.on .chk{background:var(--keep);border-color:var(--keep)}

/* bottom controls */
.actions{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;gap:16px;justify-content:center;align-items:center;
  padding:44px max(16px,env(safe-area-inset-right,0px)) calc(var(--sab) + 20px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(10,5,12,0),rgba(10,5,12,.75))}
.big{width:72px;height:72px;font-size:2rem;color:#fff;border:3px solid rgba(255,255,255,.12)}
.big.trash{background:var(--trash);box-shadow:0 10px 28px rgba(255,77,109,.5)} .big.keep{background:var(--keep);box-shadow:0 10px 28px rgba(61,220,151,.45)}
.small{width:50px;height:50px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:1.1rem;backdrop-filter:blur(8px)}
.trashbtn{position:relative}
.badge{position:absolute;top:-5px;left:-5px;background:var(--grad);color:#fff;font-size:.7rem;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.actions.series-mode .big{width:auto;height:54px;padding:0 18px;font-size:.92rem;border-radius:999px}
.actions.series-mode .mid{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);height:54px;padding:0 16px;font-size:.92rem;backdrop-filter:blur(8px)}

/* series viewer */
.viewer{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.viewer .strip{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.viewer .strip::-webkit-scrollbar{display:none}
.viewer .strip div{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center}
.viewer .strip img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vtop{position:absolute;top:0;left:0;right:0;padding:calc(var(--sat) + 10px) 14px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0));z-index:2}
.viewer .vbot{padding:14px 16px calc(var(--sab) + 16px);display:flex;justify-content:center;background:#000}
.viewer .vbot button{height:56px;padding:0 26px;font-size:1rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
.viewer .vbot button.on{background:var(--keep);border-color:var(--keep);color:#fff;box-shadow:0 8px 24px rgba(61,220,151,.4)}

/* trash drawer */
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(var(--sab) + 16px) max(16px,env(safe-area-inset-left,0px));max-height:82%;display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.drawer::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.drawer.open{transform:none}
.drawer h2{margin:0;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
.drawer h3{margin:8px 0 4px;font-size:.82rem;color:var(--muted);font-weight:500}
.drawer .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow:auto;min-height:0}
.drawer .grid div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000}
.drawer .grid img{width:100%;height:100%;object-fit:cover}
.drawer .grid button{position:absolute;top:4px;left:4px;width:26px;height:26px;font-size:.8rem;background:rgba(0,0,0,.7);padding:0}
.drawer .grid .exp{position:absolute;bottom:0;left:0;right:0;font-size:.65rem;text-align:center;background:rgba(0,0,0,.6);padding:2px}
.drawer .row button{padding:12px 18px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.drawer .row .danger{background:var(--grad);color:#fff;border:0}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.toast{position:fixed;bottom:calc(var(--sab) + 130px);left:50%;transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.9rem;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.iconbtn{width:42px;height:42px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);font-size:1.1rem;backdrop-filter:blur(6px)}
.topgroup{display:flex;gap:8px;align-items:center}
.confirm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:24px}
.confirm div{background:var(--surface);border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px}
.confirm p{margin:0;line-height:1.5}
.confirm .row button{padding:12px 20px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.confirm .row .ok{background:var(--keep);color:#fff;border:0}
@media (prefers-reduced-motion:reduce){.card.anim,.card.enter,.bar i,.toast,.drawer{transition:none;animation:none}}
</style>
</head>
<body>
<section class="panel" id="start">
  <div class="logo"><div class="mark"><i></i><i></i><i>❤</i></div><h1>Swipely</h1><p class="tag">הגלריה שלך, בהחלקה אחת</p></div>
  <div class="sub">
    <div class="chip"><b id="freed">0 MB</b><small>שוחררו</small></div>
    <div class="chip"><b id="keptN">0</b><small>שמורות</small></div>
    <div class="chip"><b id="pendN">0</b><small>בפח</small></div>
  </div>
  <p id="startMsg">ימינה = אוהב, שמאלה = ביי. מה ששמרת לא יחזור, ותמונות מ-3 הימים האחרונים מחכות בסוף.</p>
  <button class="pick" id="startBtn">בוא נתחיל ❤</button>
  <div class="row"><button class="ghost" id="vaultBtn">עבור על השמורות</button><button class="ghost" id="trashBtn0">פתח את הפח</button></div>
  <input type="file" id="files" accept="image/*" multiple hidden>
  <p id="webNote" hidden style="font-size:.8rem">מצב דפדפן: מחיקה אמיתית עובדת רק באפליקציה המותקנת.</p>
</section>

<section class="stage" id="stage" hidden></section>
<div class="bar" id="barWrap" hidden><i id="prog"></i></div>
<div class="top" id="top" hidden>
  <div class="topgroup">
    <button class="iconbtn" id="homeBtn" aria-label="חזרה">⌂</button>
    <button class="iconbtn" id="vaultIcon" aria-label="שמורות">★</button>
    <select id="bucket" hidden><option value="">כל התמונות</option></select>
  </div>
  <span class="count" id="count"></span>
</div>
<div class="actions" id="actions" hidden>
  <button class="big keep" id="btnKeep" aria-label="שמור">❤</button>
  <button class="small trashbtn" id="btnOpenTrash" aria-label="פח"><span>🗑</span><span class="badge" id="badge" hidden>0</span></button>
  <button class="small" id="btnUndo" aria-label="בטל">↶</button>
  <button class="big trash" id="btnTrash" aria-label="לפח">✕</button>
</div>
<div class="actions series-mode" id="seriesActions" hidden>
  <button class="big keep" id="sKeepAll">שמור הכל</button>
  <button class="mid" id="sKeepSel">שמור מסומנות</button>
  <button class="big trash" id="sTrashAll">מחק הכל</button>
</div>

<section class="panel" id="done" hidden>
  <div class="stat"><span id="doneN">0</span><small>תמונות נסקרו בסבב הזה</small></div>
  <p id="doneMsg"></p>
  <div class="row"><button id="doneTrash" class="pick danger">העבר לפח המערכת</button><button id="doneAgain" class="ghost">למסך הראשי</button></div>
</section>

<div class="viewer" id="viewer" hidden>
  <div class="vtop"><button class="iconbtn" id="vClose" aria-label="סגור">✕</button><span class="count" id="vCount"></span></div>
  <div class="strip" id="vStrip"></div>
  <div class="vbot"><button id="vKeep">✓ שמור את התמונה הזו</button></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <h2><span>הפח</span><button class="small" id="closeDrawer" style="width:36px;height:36px">✕</button></h2>
  <h3 id="pendH">ממתינות · <span id="trashN">0</span> · <span id="trashMB">0 MB</span></h3>
  <div class="grid" id="trashGrid"></div>
  <div class="row" id="pendRow"><button class="danger" id="emptyBtn">העבר לפח המערכת</button><button id="restoreAll">החזר הכל לגלריה</button></div>
  <h3 id="sysH" hidden>בפח המערכת · <span id="sysN">0</span> · נמחקות לבד אחרי 30 יום</h3>
  <div class="grid" id="sysGrid" hidden></div>
</div>
<div class="confirm" id="confirm" hidden><div><p id="confirmMsg"></p><div class="row"><button class="ok" id="confirmYes">כן</button><button id="confirmNo">ביטול</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const Cap=window.Capacitor, native=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
// Call the native plugin through Capacitor's built-in bridge (no bundler needed).
const Gallery=native? new Proxy({}, {get:(_,method)=>opts=>Cap.nativePromise('Gallery',method,opts||{})}) : null;
window.addEventListener('error',e=>{ try{ toast('שגיאה: '+e.message); }catch{} });
const PAGE=80, SERIES_GAP=60*1000, FRESH_DAYS=3;
let raw=[], queue=[], trash=[], history=[], total=0, offset=0, loading=false, bucket='', reviewed=0;
let mode='gallery', phase=1, phaseTotal=0, caps={systemTrash:false};
const stage=$('stage');
const thumbs={}; // id -> data url
async function loadThumbs(items){
  if(!native) { items.forEach(i=>thumbs[i.id]=thumbs[i.id]||i.src); return; }
  const need=items.filter(i=>!thumbs[i.id]).map(i=>i.id); if(!need.length) return;
  try{ const r=await Gallery.thumbnails({ids:need,size:360}); Object.assign(thumbs,r.thumbs||{}); }catch{}
}

// ---------- persistent memory (on-device) ----------
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let freedBytes=store.get('freedBytes',0);
let kept=store.get('kept',{});        // id -> timestamp kept
let pending=store.get('pending',{});  // id -> {t,size,name,src?}  photos swiped left, not yet in system trash
const saveKept=()=>store.set('kept',kept), savePending=()=>store.set('pending',pending);
function refreshHome(){ $('freed').textContent=fmt(freedBytes); $('keptN').textContent=Object.keys(kept).length; $('pendN').textContent=Object.keys(pending).length; }
refreshHome();

// ---------- loading ----------
function freshCut(){ return Date.now()-FRESH_DAYS*864e5; }
async function fetchPage(opts){ const r=await Gallery.listPhotos({limit:PAGE,...opts}); return r; }
function ingest(items){
  const seen=new Set(raw.map(i=>i.id));
  items.filter(i=>!seen.has(i.id)&&!kept[i.id]&&!pending[i.id]).forEach(i=>raw.push({...i,src:Cap.convertFileSrc(i.uri),t:i.dateTaken||i.dateAdded}));
}
async function loadMore(){
  if(loading||!native||mode!=='gallery') return; loading=true;
  try{
    // phase 1: photos older than FRESH_DAYS (newest first); phase 2: the fresh ones, last.
    let r=await fetchPage(phase===1? {offset,bucket,maxAdded:freshCut()} : {offset,bucket,minAdded:freshCut()});
    if(phase===1 && offset===0){ total=r.total; }
    phaseTotal=r.total; offset+=r.items.length; ingest(r.items);
    if(phase===1 && offset>=phaseTotal){ phase=2; offset=0; const r2=await fetchPage({offset,bucket,minAdded:freshCut()}); total+=r2.total; phaseTotal=r2.total; offset+=r2.items.length; ingest(r2.items); }
    rebuildQueue();
  }catch(e){ toast('שגיאה בטעינה: '+(e.message||e)); }
  loading=false;
}
function hasMore(){ return native && mode==='gallery' && (phase===1 || offset<phaseTotal); }
function rebuildQueue(){
  const p=raw.filter(i=>i.verdict==null); const out=[]; let i=0;
  while(i<p.length){
    const g=[p[i]]; let j=i+1;
    while(j<p.length && p[j].bucket===p[i].bucket && Math.abs(g[g.length-1].t-p[j].t)<=SERIES_GAP){ g.push(p[j]); j++; }
    out.push(g.length>1? {type:'series',items:g,sel:new Set()} : {type:'photo',item:g[0]}); i=j;
  }
  queue=out;
}
async function ensureAccess(){
  let p=await Gallery.checkAccess(); if(!p.granted) p=await Gallery.requestAccess();
  if(!p.granted){ toast('בלי גישה לגלריה אין מה לנקות'); return false; }
  try{ caps=await Gallery.capabilities(); }catch{}
  return true;
}
async function start(){
  if(!native){ $('files').click(); return; }
  if(!await ensureAccess()) return;
  mode='gallery'; phase=1; phaseTotal=0; raw=[]; queue=[]; offset=0; total=0; reviewed=0; history=[];
  await loadBuckets(); await loadMore();
  if(!queue.length && !hasMore()){ toast('אין תמונות חדשות לסקירה'); return; }
  show('stage'); render();
}
async function openVault(){
  if(!native){ toast('זמין רק באפליקציה'); return; }
  if(!await ensureAccess()) return;
  const ids=Object.keys(kept); if(!ids.length){ toast('עדיין אין תמונות שמורות'); return; }
  mode='vault'; raw=[]; queue=[]; reviewed=0; history=[]; total=ids.length; offset=total;
  for(let i=0;i<ids.length;i+=200){ try{ const r=await Gallery.listPhotos({ids:ids.slice(i,i+200),limit:200}); r.items.forEach(it=>raw.push({...it,src:Cap.convertFileSrc(it.uri),t:it.dateTaken||it.dateAdded})); }catch(e){ toast('שגיאה: '+(e.message||e)); } }
  // forget kept ids that no longer exist on the device
  const alive=new Set(raw.map(i=>i.id)); ids.forEach(id=>{ if(!alive.has(id)) delete kept[id]; }); saveKept();
  rebuildQueue(); $('bucket').hidden=true; show('stage'); render();
}
async function loadBuckets(){
  try{ const r=await Gallery.listBuckets(); const sel=$('bucket');
    sel.innerHTML='<option value="">כל התמונות</option>'+r.buckets.map(b=>`<option value="${esc(b.name)}">${esc(b.name||'(ללא אלבום)')} · ${b.count}</option>`).join('');
    sel.value=bucket; sel.hidden=false; }catch{}
}
$('bucket').onchange=async e=>{ bucket=e.target.value; raw=[]; queue=[]; offset=0; total=0; phase=1; phaseTotal=0; reviewed=0; await loadMore(); render(); };
$('files').onchange=e=>{
  const list=[...e.target.files].filter(f=>f.type.startsWith('image/')); if(!list.length) return;
  mode='gallery'; raw=list.map((f,i)=>({id:'w'+i+'-'+f.name,name:f.name,size:f.size,t:f.lastModified,bucket:'',src:URL.createObjectURL(f)})).sort((a,b)=>b.t-a.t);
  total=raw.length; offset=total; reviewed=0; rebuildQueue(); show('stage'); render();
};
if(!native) $('webNote').hidden=false;
$('startBtn').onclick=start; $('vaultBtn').onclick=openVault; $('vaultIcon').onclick=openVault;
$('homeBtn').onclick=()=>{ history=[]; show('start'); };
$('trashBtn0').onclick=openDrawer;

// ---------- rendering ----------
function show(w){
  $('start').hidden=w!=='start'; if(w==='start') refreshHome();
  stage.hidden=$('top').hidden=$('barWrap').hidden=w!=='stage';
  if(w!=='stage'){ $('actions').hidden=$('seriesActions').hidden=true; }
  $('done').hidden=w!=='done';
}
function render(){
  const all=total||raw.length;
  $('count').textContent=(mode==='vault'?'★ ':'')+(all? `${reviewed} / ${all}`:'');
  $('prog').style.width=all? (Math.min(reviewed,all)/all*100)+'%':'0';
  const pn=Object.keys(pending).length; $('badge').hidden=!pn; $('badge').textContent=pn;
  if(!queue.length){ if(hasMore()){ loadMore().then(render); return; } finish(); return; }
  if(hasMore() && queue.length<6) loadMore();
  queue.slice(0,4).filter(e=>e.type==='series').forEach(e=>loadThumbs(e.items));
  stage.innerHTML='';
  if(queue[1]) stage.appendChild(card(queue[1],false));
  const topCard=card(queue[0],true); topCard.classList.add('enter'); stage.appendChild(topCard);
  const s=queue[0].type==='series'; $('actions').hidden=s; $('seriesActions').hidden=!s; if(s) updateSeriesButtons();
}
function card(entry,top){
  const c=document.createElement('div');
  if(entry.type==='photo'){
    const it=entry.item, d=it.t? new Date(it.t).toLocaleDateString('he-IL'):'';
    c.className='card';
    c.innerHTML=`<img class="full" src="${it.src}" alt=""><div class="meta">${esc(it.name||'')} · ${fmt(it.size)} · ${d}</div><span class="stamp keep">אוהב</span><span class="stamp trash">ביי</span>`;
  } else {
    const g=entry.items, d=new Date(g[0].t).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'});
    c.className='card series';
    c.innerHTML=`<div class="head"><b>סדרה של ${g.length} תמונות</b><span>${d} · ${fmt(sum(g))} · הקש על תמונה לצפייה ולבחירה</span></div>
      <div class="grid">${g.map((it,i)=>`<div data-i="${i}" class="${entry.sel.has(it)?'on':''}"><img src="${thumbs[it.id]||''}" alt=""><span class="chk">${entry.sel.has(it)?'✓':''}</span></div>`).join('')}</div>
      <span class="stamp keep">שמור הכל</span><span class="stamp trash">מחק הכל</span>`;
    loadThumbs(g).then(()=>{ c.querySelectorAll('.grid div').forEach(tile=>{ const im=tile.querySelector('img'), t=thumbs[g[+tile.dataset.i].id]; if(t&&im.src!==t) im.src=t; }); });
    if(top) c.querySelectorAll('.grid div').forEach(tile=>{
      let moved=false, sx=0, sy=0;
      tile.onpointerdown=e=>{ moved=false; sx=e.clientX; sy=e.clientY; };
      tile.onpointermove=e=>{ if(Math.hypot(e.clientX-sx,e.clientY-sy)>10) moved=true; };
      tile.onpointerup=()=>{ if(!moved) openViewer(entry,+tile.dataset.i); };
    });
  }
  if(!top){ c.classList.add('under'); return c; }
  let sx=0,sy=0,dx=0,drag=false,horizontal=null;
  const sk=c.querySelector('.stamp.keep'), st=c.querySelector('.stamp.trash');
  c.addEventListener('pointerdown',e=>{drag=true;horizontal=null;sx=e.clientX;sy=e.clientY;c.classList.remove('anim')});
  c.addEventListener('pointermove',e=>{ if(!drag)return; dx=e.clientX-sx; const dy=e.clientY-sy;
    if(horizontal===null && (Math.abs(dx)>8||Math.abs(dy)>8)) horizontal=Math.abs(dx)>Math.abs(dy);
    if(!horizontal) return; try{c.setPointerCapture(e.pointerId)}catch{}
    c.style.transform=`translate(${dx}px,${dy*.25}px) rotate(${dx/22}deg)`; sk.style.opacity=clamp(dx/90); st.style.opacity=clamp(-dx/90); });
  const end=()=>{ if(!drag)return; drag=false; const th=Math.min(120,window.innerWidth*.3);
    if(horizontal && dx>th) decide('keep'); else if(horizontal && dx<-th) decide('trash');
    else { c.classList.add('anim'); c.style.transform=''; sk.style.opacity=st.style.opacity=0; } dx=0; };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
  return c;
}
function updateSeriesButtons(){ const e=queue[0]; if(!e||e.type!=='series') return; const n=e.sel.size; $('sKeepSel').textContent=n? `שמור ${n} מסומנות`:'שמור מסומנות'; $('sKeepSel').disabled=!n; }
// ---------- series viewer ----------
let vEntry=null, vIdx=0;
function openViewer(entry,idx){
  vEntry=entry; vIdx=idx; const g=entry.items;
  $('vStrip').innerHTML=g.map(it=>`<div><img src="${it.src}" alt="" loading="lazy"></div>`).join('');
  $('viewer').hidden=false;
  const strip=$('vStrip'); strip.scrollLeft=0; requestAnimationFrame(()=>{ strip.children[idx]?.scrollIntoView({inline:'center',block:'nearest'}); updateViewer(); });
  strip.onscroll=()=>{ clearTimeout(strip._t); strip._t=setTimeout(()=>{ const w=strip.clientWidth; vIdx=Math.round(Math.abs(strip.scrollLeft)/w); updateViewer(); },60); };
}
function updateViewer(){ if(!vEntry) return; const g=vEntry.items; vIdx=Math.max(0,Math.min(g.length-1,vIdx)); const on=vEntry.sel.has(g[vIdx]);
  $('vCount').textContent=`${vIdx+1} / ${g.length}`; $('vKeep').textContent=on? '✓ מסומנת לשמירה' : 'שמור את התמונה הזו'; $('vKeep').classList.toggle('on',on); }
$('vKeep').onclick=()=>{ if(!vEntry) return; const it=vEntry.items[vIdx]; vEntry.sel.has(it)? vEntry.sel.delete(it) : vEntry.sel.add(it); updateViewer(); };
function closeViewer(){ $('viewer').hidden=true; const e=vEntry; vEntry=null; if(e===queue[0]) render(); }
$('vClose').onclick=closeViewer;

// ---------- decisions ----------
function decide(v, selection){
  const entry=queue.shift(); if(!entry) return;
  const items=entry.type==='photo'? [entry.item] : entry.items;
  const rec={items:[],verdicts:[]};
  items.forEach(it=>{ let vv=v; if(v==='sel') vv=selection.has(it)?'keep':'trash'; it.verdict=vv; rec.items.push(it); rec.verdicts.push(vv);
    if(vv==='trash'){ delete kept[it.id]; pending[it.id]={t:Date.now(),size:it.size,name:it.name,uri:it.uri}; }
    else { kept[it.id]=Date.now(); } });
  saveKept(); savePending();
  reviewed+=items.length; history.push(rec);
  if(navigator.vibrate) navigator.vibrate(v==='trash'?25:10);
  const top=stage.lastElementChild, right=v!=='trash';
  if(top){ top.classList.add('anim'); top.style.transform=`translateX(${right?'130%':'-130%'}) rotate(${right?18:-18}deg)`; top.style.opacity='0'; }
  setTimeout(render,230);
}
function undo(){ const h=history.pop(); if(!h){toast('אין מה לבטל');return;}
  h.items.forEach((it,i)=>{ it.verdict=null; if(h.verdicts[i]==='trash') delete pending[it.id]; else if(mode!=='vault') delete kept[it.id]; else kept[it.id]=Date.now(); });
  saveKept(); savePending(); reviewed-=h.items.length; rebuildQueue(); show('stage'); render(); }
$('btnKeep').onclick=()=>decide('keep'); $('btnTrash').onclick=()=>decide('trash'); $('btnUndo').onclick=undo;
$('sKeepAll').onclick=()=>decide('keep'); $('sTrashAll').onclick=()=>decide('trash');
$('sKeepSel').onclick=()=>{ const e=queue[0]; if(e&&e.sel.size) decide('sel',e.sel); };
document.addEventListener('keydown',e=>{ if(stage.hidden)return; if(e.key==='ArrowRight')decide('keep'); else if(e.key==='ArrowLeft')decide('trash'); else if(e.key==='Backspace'||e.key==='z')undo(); });

function finish(){
  show('done'); $('doneN').textContent=reviewed; const pn=Object.keys(pending).length;
  $('doneMsg').textContent= mode==='vault'? 'סיימת לעבור על השמורות. ❤' : pn? `${pn} תמונות ממתינות לפח (${fmt(pendingBytes())}). לחיצה אחת מעבירה אותן לפח המערכת, ומשם הן נמחקות לבד אחרי 30 יום.` : 'אין תמונות ממתינות. הגלריה נקייה.';
  $('doneTrash').hidden=!pn;
}
$('doneAgain').onclick=()=>{ history=[]; show('start'); };
$('doneTrash').onclick=flushPending;

// ---------- trash drawer ----------
function pendingBytes(){ return Object.values(pending).reduce((s,p)=>s+(p.size||0),0); }
function openDrawer(){ renderTrash(); $('drawer').classList.add('open'); $('scrim').classList.add('show'); }
function closeDrawer(){ $('drawer').classList.remove('open'); $('scrim').classList.remove('show'); }
$('btnOpenTrash').onclick=openDrawer; $('closeDrawer').onclick=closeDrawer; $('scrim').onclick=closeDrawer;
function ask(msg){ return new Promise(res=>{ $('confirmMsg').textContent=msg; $('confirm').hidden=false;
  $('confirmYes').onclick=()=>{ $('confirm').hidden=true; res(true); }; $('confirmNo').onclick=()=>{ $('confirm').hidden=true; res(false); }; }); }
async function renderTrash(){
  const ids=Object.keys(pending);
  $('trashN').textContent=ids.length; $('trashMB').textContent=fmt(pendingBytes());
  await loadThumbs(ids.map(id=>({id,src:(raw.find(r=>r.id===id)||{}).src||''})));
  $('trashGrid').innerHTML=ids.map(id=>`<div><img src="${thumbs[id]||''}" alt="" loading="lazy"><button data-id="${id}" aria-label="החזר">↶</button></div>`).join('')||'<div style="aspect-ratio:auto;background:none;color:var(--muted);font-size:.85rem;grid-column:1/-1">הפח ריק</div>';
  $('trashGrid').querySelectorAll('button').forEach(b=>b.onclick=async()=>{ if(!await ask('להחזיר את התמונה לגלריה?')) return; restoreOne(b.dataset.id); renderTrash(); });
  $('emptyBtn').disabled=!ids.length; $('restoreAll').disabled=!ids.length;
  // system trash
  if(native && caps.systemTrash){
    try{ const r=await Gallery.listPhotos({trashed:true,limit:500}); $('sysH').hidden=$('sysGrid').hidden=false; $('sysN').textContent=r.total;
      await loadThumbs(r.items);
      $('sysGrid').innerHTML=r.items.map(it=>{ const days=it.expires? Math.max(0,Math.ceil((it.expires-Date.now())/864e5)):''; return `<div><img src="${thumbs[it.id]||''}" alt="" loading="lazy"><button data-id="${it.id}" aria-label="שחזר">↶</button><span class="exp">${days!==''? days+' ימים':''}</span></div>`; }).join('')||'<div style="aspect-ratio:auto;background:none;color:var(--muted);font-size:.85rem;grid-column:1/-1">פח המערכת ריק</div>';
      $('sysGrid').querySelectorAll('button').forEach(b=>b.onclick=async()=>{ if(!await ask('לשחזר את התמונה מפח המערכת לגלריה?')) return;
        try{ const res=await Gallery.restorePhotos({ids:[b.dataset.id]}); if(res.confirmed!==false){ toast('שוחזרה לגלריה'); delete kept[b.dataset.id]; saveKept(); } }catch(e){ toast('השחזור נכשל: '+(e.message||e)); } renderTrash(); });
    }catch(e){ $('sysH').hidden=$('sysGrid').hidden=true; }
  }
}
function restoreOne(id){ delete pending[id]; savePending(); const it=raw.find(r=>r.id===id); if(it){ it.verdict=null; reviewed--; rebuildQueue(); if(!stage.hidden) render(); } refreshHome(); }
$('restoreAll').onclick=async()=>{ if(!await ask(`להחזיר את כל ${Object.keys(pending).length} התמונות לגלריה?`)) return; Object.keys(pending).forEach(restoreOne); renderTrash(); };
async function flushPending(){
  const ids=Object.keys(pending); if(!ids.length) return;
  if(!native){ toast('בדפדפן אי אפשר למחוק מהמכשיר'); return; }
  const bytes=pendingBytes();
  try{
    const r= caps.systemTrash? await Gallery.trashPhotos({ids}) : await Gallery.deletePhotos({ids});
    if(r.confirmed===false){ toast('בוטל'); return; }
    freedBytes+=bytes; store.set('freedBytes',freedBytes); ids.forEach(id=>delete pending[id]); savePending();
    raw=raw.filter(i=>!ids.includes(i.id)); history=[];
    toast(caps.systemTrash? `${ids.length} תמונות הועברו לפח המערכת · ${fmt(bytes)}` : `נמחקו ${ids.length} תמונות · ${fmt(bytes)}`);
  }catch(e){ toast('נכשל: '+(e.message||e)); }
  renderTrash(); closeDrawer(); refreshHome();
  if(!$('done').hidden) finish(); else if(!stage.hidden) render();
}
$('emptyBtn').onclick=flushPending;

// ---------- helpers ----------
function sum(a){return a.reduce((s,i)=>s+(i.size||0),0)}
function clamp(x){return Math.min(1,Math.max(0,x))}
function fmt(b){ return b>=1e9? (b/1e9).toFixed(2)+' GB' : b>=1e6? (b/1e6).toFixed(1)+' MB' : Math.round(b/1e3)+' KB'; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
</script>
</body>
